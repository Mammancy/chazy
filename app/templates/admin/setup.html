<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }} Admin Setup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/admin/dashboard.css" rel="stylesheet">
</head>
<body>
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="admin-card p-4" style="max-width: 520px; width: 100%;">
        <div class="mb-4">
            <p class="status-label mb-1">{{ app_name }} Admin</p>
            <h1 class="h3 mb-2">Create first administrator</h1>
            <p class="text-secondary mb-0">This setup page is only available while no administrator exists.</p>
        </div>
        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="/admin/setup">
            <div class="mb-3">
                <label class="form-label" for="full_name">Full name</label>
                <input class="form-control" id="full_name" name="full_name" type="text" autocomplete="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="phone_number">Phone number</label>
                <input class="form-control" id="phone_number" name="phone_number" type="tel" autocomplete="tel" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="country">Country</label>
                    <input class="form-control" id="country" name="country" type="text" autocomplete="country-name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="state">State</label>
                    <input class="form-control" id="state" name="state" type="text" autocomplete="address-level1" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Create administrator</button>
        </form>
    </section>
</main>
</body>
</html>

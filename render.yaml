services:
  - type: web
    name: confidence-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Confidence
      - key: APP_VERSION
        value: 0.1.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_TIMEOUT_SECONDS
        value: 30
      - key: OPENAI_MAX_RETRIES
        value: 2
      - key: OPENAI_RETRY_BASE_DELAY_SECONDS
        value: 0.5
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: 30
      - key: JWT_REFRESH_TOKEN_DAYS
        value: 30
      - key: JWT_ISSUER
        value: confidence-api
      - key: ADMIN_EMAILS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: true
      - key: SMTP_USE_SSL
        value: false
      - key: SMTP_TIMEOUT_SECONDS
        value: 20
      - key: PASSWORD_RESET_BASE_URL
        sync: false
